<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0c10;
  --surface: #12151c;
  --surface2: #1a1e28;
  --surface3: #222736;
  --border: #2a2f3e;
  --border2: #353c50;
  --text: #e2e8f0;
  --muted: #6b7592;
  --accent: #4ade80;
  --accent2: #22c55e;
  --red: #f87171;
  --red2: #ef4444;
  --blue: #60a5fa;
  --yellow: #fbbf24;
  --purple: #a78bfa;
  --orange: #fb923c;
  --mono: 'Space Mono', monospace;
  --sans: 'DM Sans', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;overflow-x:hidden}
/* Scrollbar */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* LAYOUT */
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100}
.logo{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--accent);letter-spacing:-0.5px;white-space:nowrap}
.logo span{color:var(--muted);font-weight:400}
.nav{display:flex;gap:2px;flex:1;overflow-x:auto}
.nav::-webkit-scrollbar{height:0}
.nav-btn{background:none;border:none;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 14px;border-radius:6px;cursor:pointer;white-space:nowrap;transition:all .15s}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:var(--accent);background:rgba(74,222,128,.08)}
.header-right{display:flex;gap:8px;align-items:center;margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:7px;border:none;font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--border2);background:var(--surface2)}
.btn-danger{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.2)}
.btn-danger:hover{background:rgba(248,113,113,.2)}
.btn-sm{padding:5px 10px;font-size:12px}

.main{flex:1;padding:20px;max-width:1600px;margin:0 auto;width:100%}
.page{display:none}
.page.active{display:block}

/* STAT CARDS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);opacity:.4}
.stat-card.green::before{background:var(--accent)}
.stat-card.red::before{background:var(--red)}
.stat-card.blue::before{background:var(--blue)}
.stat-card.yellow::before{background:var(--yellow)}
.stat-card.purple::before{background:var(--purple)}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;font-family:var(--mono)}
.stat-value{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1}
.stat-value.green{color:var(--accent)}
.stat-value.red{color:var(--red)}
.stat-value.blue{color:var(--blue)}
.stat-value.yellow{color:var(--yellow)}
.stat-sub{font-size:11px;color:var(--muted);margin-top:5px}

/* CHARTS */
.charts-grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:20px}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.chart-title{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-family:var(--mono);margin-bottom:14px}
canvas{display:block;width:100%!important}

/* TABLE */
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.table-header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.table-title{font-family:var(--mono);font-size:13px;font-weight:700}
.table-actions{display:flex;gap:8px;align-items:center}
.search-input{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;padding:6px 10px;outline:none;width:200px}
.search-input:focus{border-color:var(--accent)}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--surface2);color:var(--muted);font-family:var(--mono);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:9px 12px;border-bottom:1px solid rgba(42,47,62,.6);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--surface2)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;font-family:var(--mono)}
.badge-buy{background:rgba(74,222,128,.12);color:var(--accent)}
.badge-sell{background:rgba(248,113,113,.12);color:var(--red)}
.badge-confirm{background:rgba(74,222,128,.1);color:var(--accent);font-size:11px}
.badge-noconfirm{background:rgba(248,113,113,.1);color:var(--red);font-size:11px}
.pnl-pos{color:var(--accent);font-family:var(--mono);font-weight:700}
.pnl-neg{color:var(--red);font-family:var(--mono);font-weight:700}
.mono{font-family:var(--mono)}

/* ADD TRADE FORM */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px}
.form-title{font-family:var(--mono);font-size:13px;font-weight:700;margin-bottom:16px;color:var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group.wide{grid-column:span 2}
.form-group.full{grid-column:1/-1}
label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:var(--sans);font-size:13px;padding:8px 10px;outline:none;transition:border-color .15s;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
select option{background:var(--surface)}
textarea{resize:vertical;min-height:64px}
.side-toggle{display:flex;gap:6px}
.side-btn{flex:1;padding:8px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-family:var(--mono);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center}
.side-btn.buy.active{background:rgba(74,222,128,.15);border-color:var(--accent);color:var(--accent)}
.side-btn.sell.active{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red)}
.star-rating{display:flex;gap:4px;cursor:pointer}
.star-rating span{font-size:20px;color:var(--border2);transition:color .15s}
.star-rating span.active{color:var(--yellow)}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* EQUITY CURVE */
.equity-wrap{height:180px;position:relative}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-title{font-family:var(--mono);font-size:15px;font-weight:700;margin-bottom:20px;color:var(--accent)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* TABS in add trade */
.sub-tabs{display:flex;gap:2px;background:var(--surface2);border-radius:8px;padding:3px;margin-bottom:16px}
.sub-tab{flex:1;padding:7px 10px;border-radius:6px;border:none;background:none;color:var(--muted);font-family:var(--sans);font-size:12px;font-weight:500;cursor:pointer;text-align:center;transition:all .15s}
.sub-tab.active{background:var(--surface);color:var(--text)}

/* INSIGHT CARDS */
.insights-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:20px}
.insight-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px}
.insight-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}
.insight-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(42,47,62,.5)}
.insight-row:last-child{border-bottom:none}
.insight-key{color:var(--muted);font-size:12px}
.insight-val{font-family:var(--mono);font-size:12px;font-weight:700}

/* Daily heatmap */
.heatmap{display:grid;gap:3px}
.heatmap-cell{height:28px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--mono);font-weight:700;cursor:default;transition:opacity .15s}
.heatmap-cell:hover{opacity:.8}

/* RESPONSIVE */
@media(max-width:768px){
  .header{padding:0 12px;gap:10px}
  .logo{font-size:13px}
  .nav{gap:0}
  .nav-btn{padding:5px 10px;font-size:12px}
  .main{padding:12px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:12px}
  .stat-value{font-size:18px}
  .charts-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:repeat(2,1fr)}
  .form-group.wide{grid-column:span 2}
  .search-input{width:130px}
  .btn{padding:6px 10px}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stat-value{font-size:16px}
  .charts-grid{grid-template-columns:1fr}
  table{font-size:11.5px}
  th,td{padding:7px 8px}
  .header-right .btn-ghost{display:none}
}

/* Import section */
.import-drop{border:2px dashed var(--border2);border-radius:10px;padding:40px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px}
.import-drop:hover,.import-drop.drag{border-color:var(--accent);background:rgba(74,222,128,.04)}
.import-drop p{color:var(--muted);font-size:13px;margin-top:8px}

/* Notification */
.toast{position:fixed;bottom:20px;right:20px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-size:13px;z-index:300;transition:all .3s;transform:translateY(80px);opacity:0;max-width:300px}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(74,222,128,.4);color:var(--accent)}
.toast.error{border-color:rgba(248,113,113,.4);color:var(--red)}

.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state svg{margin-bottom:12px;opacity:.3}
.empty-state p{font-size:13px}

/* Bar chart */
.bar-chart{display:flex;flex-direction:column;gap:6px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar-label{font-size:11px;color:var(--muted);width:80px;text-align:right;font-family:var(--mono)}
.bar-track{flex:1;background:var(--surface2);border-radius:3px;height:16px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .4s}
.bar-val{font-size:11px;font-family:var(--mono);width:50px}

/* Progress ring */
.ring-wrap{display:flex;justify-content:center;align-items:center;flex-direction:column;gap:8px;padding:10px 0}
.ring-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-family:var(--mono)}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <header class="header">
    <div class="logo">TJ<span>/v1</span></div>
    <nav class="nav">
      <button class="nav-btn active" onclick="switchPage('dashboard',this)">Dashboard</button>
      <button class="nav-btn" onclick="switchPage('tradelog',this)">Trade Log</button>
      <button class="nav-btn" onclick="switchPage('addtrade',this)">+ Add Trade</button>
      <button class="nav-btn" onclick="switchPage('insights',this)">Insights</button>
    </nav>
    <div class="header-right">
      <button class="btn btn-ghost btn-sm" onclick="exportCSV()">↓ CSV</button>
      <button class="btn btn-ghost btn-sm" onclick="document.getElementById('importFile').click()">↑ Import</button>
      <input type="file" id="importFile" accept=".json,.csv,.xlsx" style="display:none" onchange="importData(this)">
    </div>
  </header>

  <main class="main">
    <!-- DASHBOARD -->
    <div class="page active" id="page-dashboard">
      <div class="stats-grid" id="statsGrid"></div>
      <div class="charts-grid">
        <div class="chart-card">
          <div class="chart-title">📈 Equity Curve</div>
          <div class="equity-wrap"><canvas id="equityChart"></canvas></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">🎯 Win / Loss Split</div>
          <canvas id="winlossChart" style="max-height:160px"></canvas>
        </div>
      </div>
      <div class="charts-grid" style="grid-template-columns:1fr 1fr">
        <div class="chart-card">
          <div class="chart-title">📅 P&L Heatmap (รายวัน)</div>
          <div id="heatmapWrap"></div>
        </div>
        <div class="chart-card">
          <div class="chart-title">🗺 Zone Performance</div>
          <div class="bar-chart" id="zoneChart"></div>
        </div>
      </div>
      <div class="charts-grid" style="grid-template-columns:1fr 1fr 1fr">
        <div class="chart-card">
          <div class="chart-title">😊 Emotion</div>
          <canvas id="emotionChart" style="max-height:140px"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">📊 BUY vs SELL</div>
          <canvas id="sideChart" style="max-height:140px"></canvas>
        </div>
        <div class="chart-card">
          <div class="chart-title">⚠ Mistakes</div>
          <div class="bar-chart" id="mistakeChart"></div>
        </div>
      </div>
    </div>

    <!-- TRADE LOG -->
    <div class="page" id="page-tradelog">
      <div class="table-wrap">
        <div class="table-header">
          <span class="table-title">Trade Log</span>
          <div class="table-actions">
            <input type="text" class="search-input" placeholder="ค้นหา..." id="searchInput" oninput="filterTable()">
            <select class="search-input" style="width:110px" id="filterSide" onchange="filterTable()">
              <option value="">ทุก Side</option>
              <option>BUY</option>
              <option>SELL</option>
            </select>
          </div>
        </div>
        <div class="table-scroll">
          <table id="tradeTable">
            <thead>
              <tr>
                <th>#</th><th>Date</th><th>Side</th><th>Lot</th>
                <th>Entry</th><th>Exit</th><th>SL</th><th>TP</th>
                <th>P&L</th><th>Balance</th><th>R:R</th>
                <th>Trend</th><th>Zone</th><th>Confirm</th><th>Emo</th><th>Notes</th>
                <th>Act</th>
              </tr>
            </thead>
            <tbody id="tradeBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- ADD TRADE -->
    <div class="page" id="page-addtrade">
      <div class="form-card">
        <div class="form-title" id="formTitle">+ เพิ่ม Trade ใหม่</div>
        <div class="form-grid">
          <div class="form-group">
            <label>📅 Date</label>
            <input type="date" id="f_date">
          </div>
          <div class="form-group">
            <label>🕓 Start Time</label>
            <input type="time" id="f_start">
          </div>
          <div class="form-group">
            <label>🕓 End Time</label>
            <input type="time" id="f_end">
          </div>
          <div class="form-group">
            <label>↕ Side</label>
            <div class="side-toggle">
              <button class="side-btn buy" onclick="setSide('BUY',this)">BUY</button>
              <button class="side-btn sell" onclick="setSide('SELL',this)">SELL</button>
            </div>
          </div>
          <div class="form-group">
            <label>📦 Lot</label>
            <input type="number" id="f_lot" step="0.01" min="0.01" placeholder="0.01">
          </div>
          <div class="form-group">
            <label>⬆ Entry Price</label>
            <input type="number" id="f_entry" step="0.1">
          </div>
          <div class="form-group">
            <label>⬇ Exit Price</label>
            <input type="number" id="f_exit" step="0.1">
          </div>
          <div class="form-group">
            <label>🛡 SL Price</label>
            <input type="number" id="f_sl" step="0.1">
          </div>
          <div class="form-group">
            <label>🎯 TP Price</label>
            <input type="number" id="f_tp" step="0.1">
          </div>
          <div class="form-group">
            <label>💰 P&L ($)</label>
            <input type="number" id="f_pnl" step="0.01" placeholder="คำนวณอัตโนมัติ">
          </div>
          <div class="form-group">
            <label>📈 Trend (M15)</label>
            <select id="f_trend">
              <option value="">-- เลือก --</option>
              <option>Uptrend</option>
              <option>Downtrend</option>
              <option>Sideways</option>
            </select>
          </div>
          <div class="form-group">
            <label>🗺 Zone</label>
            <select id="f_zone">
              <option value="">-- เลือก --</option>
              <option>OB</option>
              <option>Supply</option>
              <option>Demand</option>
              <option>POI</option>
              <option>FVG</option>
              <option>Divergence</option>
            </select>
          </div>
          <div class="form-group">
            <label>✅ Confirm</label>
            <select id="f_confirm">
              <option value="✅">✅ Confirm</option>
              <option value="❌">❌ No Confirm</option>
            </select>
          </div>
          <div class="form-group">
            <label>😊 Emotion</label>
            <select id="f_emotion">
              <option>😊</option>
              <option>😄</option>
              <option>😐</option>
              <option>😟</option>
            </select>
          </div>
          <div class="form-group">
            <label>⚠ Mistake</label>
            <select id="f_mistake">
              <option value="">— ไม่มี —</option>
              <option>เข้าก่อน confirm</option>
              <option>ไม่ยอม SL</option>
              <option>Overtrading</option>
              <option>Revenge trade</option>
              <option>ผิด session</option>
              <option>อื่นๆ</option>
            </select>
          </div>
          <div class="form-group full">
            <label>📝 Notes</label>
            <textarea id="f_notes" placeholder="บันทึกเพิ่มเติม..."></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-ghost" onclick="clearForm()">Clear</button>
          <button class="btn btn-primary" onclick="saveTrade()" id="saveBtn">Add Trade</button>
        </div>
      </div>
    </div>

    <!-- INSIGHTS -->
    <div class="page" id="page-insights">
      <div class="insights-grid" id="insightsGrid"></div>
    </div>
  </main>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-title">⚠ ยืนยันการลบ</div>
    <p style="color:var(--muted);font-size:13px">คุณต้องการลบ trade นี้ใช่ไหม?</p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('deleteModal')">ยกเลิก</button>
      <button class="btn btn-danger" onclick="confirmDelete()">ลบ</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// ============================================================
//  DATA LAYER
// ============================================================
const STORAGE_KEY = 'tj_trades_v1';
let trades = [];
let editingId = null;
let deleteId = null;
let currentSide = '';

// Pre-loaded sample data from Excel
const SAMPLE_TRADES = [

//  STATS
// ============================================================
function calcStats(){
  const total = trades.length;
  const wins = trades.filter(t=>t.pnl>0).length;
  const losses = trades.filter(t=>t.pnl<0).length;
  const winRate = total>0 ? (wins/total*100).toFixed(1) : 0;
  const grossP = trades.reduce((a,t)=>t.pnl>0?a+t.pnl:a,0);
  const grossL = trades.reduce((a,t)=>t.pnl<0?a+t.pnl:a,0);
  const netPnL = trades.reduce((a,t)=>a+t.pnl,0);
  const avgWin = wins>0?(grossP/wins).toFixed(2):0;
  const avgLoss = losses>0?(grossL/losses).toFixed(2):0;
  const pf = grossL!==0 ? (grossP/Math.abs(grossL)).toFixed(2) : grossP>0?'∞':'0';
  const avgRR = total>0?(trades.reduce((a,t)=>a+t.rr,0)/total).toFixed(2):0;
  const best = total>0?Math.max(...trades.map(t=>t.pnl)):0;
  const worst = total>0?Math.min(...trades.map(t=>t.pnl)):0;
  const curBal = trades.length>0?trades[trades.length-1].balance:100;
  // max drawdown
  let peak=trades[0]?.balance||0, dd=0;
  trades.forEach(t=>{if(t.balance>peak)peak=t.balance;if(peak-t.balance>dd)dd=peak-t.balance;});
  return {total,wins,losses,winRate,grossP,grossL,netPnL,avgWin,avgLoss,pf,avgRR,best,worst,curBal,maxDD:dd};
}

function renderDashboard(){
  const s = calcStats();
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card green"><div class="stat-label">Net P&L</div><div class="stat-value ${s.netPnL>=0?'green':'red'}">$${s.netPnL}</div><div class="stat-sub">Gross: +${s.grossP} / ${s.grossL}</div></div>
    <div class="stat-card blue"><div class="stat-label">Total Trades</div><div class="stat-value blue">${s.total}</div><div class="stat-sub">W:${s.wins} / L:${s.losses}</div></div>
    <div class="stat-card yellow"><div class="stat-label">Win Rate</div><div class="stat-value yellow">${s.winRate}%</div><div class="stat-sub">Avg RR: ${s.avgRR}</div></div>
    <div class="stat-card green"><div class="stat-label">Profit Factor</div><div class="stat-value green">${s.pf}</div><div class="stat-sub">Avg Win: $${s.avgWin}</div></div>
    <div class="stat-card red"><div class="stat-label">Max Drawdown</div><div class="stat-value red">-$${s.maxDD}</div><div class="stat-sub">Worst: $${s.worst}</div></div>
    <div class="stat-card blue"><div class="stat-label">Balance</div><div class="stat-value blue">$${s.curBal}</div><div class="stat-sub">Best: $${s.best}</div></div>
  `;
  renderCharts(s);
  renderHeatmap();
  renderZoneChart();
  renderMistakeChart();
}

let chartInstances = {};
function destroyChart(id){ if(chartInstances[id]){chartInstances[id].destroy();delete chartInstances[id];} }

function renderCharts(s){
  // Equity
  destroyChart('equity');
  const ctx1 = document.getElementById('equityChart').getContext('2d');
  const labels = trades.map(t=>t.id);
  const data = trades.map(t=>t.balance);
  const startBal = (trades[0]?.balance||100) - (trades[0]?.pnl||0);
  chartInstances['equity'] = new Chart(ctx1,{
    type:'line',
    data:{labels:[0,...labels],datasets:[{
      data:[startBal,...data],
      borderColor:'#4ade80',fill:true,
      backgroundColor:'rgba(74,222,128,0.06)',
      tension:.4,pointRadius:2,pointHoverRadius:5,
      borderWidth:2,pointBackgroundColor:'#4ade80'
    }]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`$${c.raw}`}}},
      scales:{x:{display:false},y:{grid:{color:'rgba(255,255,255,0.04)'},ticks:{color:'#6b7592',font:{family:'Space Mono',size:10},callback:v=>`$${v}`}}}}
  });

  // Win/Loss doughnut
  destroyChart('winloss');
  const ctx2 = document.getElementById('winlossChart').getContext('2d');
  chartInstances['winloss'] = new Chart(ctx2,{
    type:'doughnut',
    data:{labels:['Win','Loss','BE'],datasets:[{data:[s.wins,s.losses,s.total-s.wins-s.losses],backgroundColor:['rgba(74,222,128,0.8)','rgba(248,113,113,0.8)','rgba(107,117,146,0.5)'],borderWidth:0,hoverOffset:4}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#6b7592',font:{size:11},boxWidth:10,padding:10}},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw}`}}},cutout:'65%'}
  });

  // Emotion
  destroyChart('emotion');
  const emotionData = {};
  trades.forEach(t=>{emotionData[t.emotion]=(emotionData[t.emotion]||0)+1;});
  const ctx3 = document.getElementById('emotionChart').getContext('2d');
  chartInstances['emotion'] = new Chart(ctx3,{
    type:'doughnut',
    data:{labels:Object.keys(emotionData),datasets:[{data:Object.values(emotionData),backgroundColor:['rgba(74,222,128,.7)','rgba(251,191,36,.7)','rgba(107,117,146,.7)','rgba(248,113,113,.7)'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#6b7592',font:{size:11},boxWidth:10}}},cutout:'60%'}
  });

  // Side
  destroyChart('side');
  const buyCount = trades.filter(t=>t.side==='BUY').length;
  const sellCount = trades.filter(t=>t.side==='SELL').length;
  const ctx4 = document.getElementById('sideChart').getContext('2d');
  chartInstances['side'] = new Chart(ctx4,{
    type:'doughnut',
    data:{labels:['BUY','SELL'],datasets:[{data:[buyCount,sellCount],backgroundColor:['rgba(74,222,128,.7)','rgba(248,113,113,.7)'],borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom',labels:{color:'#6b7592',font:{size:11},boxWidth:10}}},cutout:'60%'}
  });
}

function renderZoneChart(){
  const zones = {};
  trades.forEach(t=>{
    if(!zones[t.zone]) zones[t.zone]={pnl:0,count:0};
    zones[t.zone].pnl+=t.pnl; zones[t.zone].count++;
  });
  const sorted = Object.entries(zones).sort((a,b)=>b[1].pnl-a[1].pnl);
  const max = Math.max(...sorted.map(([,v])=>Math.abs(v.pnl)),1);
  const el = document.getElementById('zoneChart');
  el.innerHTML = sorted.map(([z,v])=>`
    <div class="bar-row">
      <div class="bar-label">${z}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${Math.abs(v.pnl)/max*100}%;background:${v.pnl>=0?'rgba(74,222,128,.6)':'rgba(248,113,113,.6)'}"></div>
      </div>
      <div class="bar-val ${v.pnl>=0?'pnl-pos':'pnl-neg'}">$${v.pnl}</div>
    </div>`).join('');
}

function renderMistakeChart(){
  const mk = {};
  trades.forEach(t=>{ if(t.mistake){mk[t.mistake]=(mk[t.mistake]||0)+1;} });
  const sorted = Object.entries(mk).sort((a,b)=>b[1]-a[1]);
  const max = sorted[0]?.[1]||1;
  const el = document.getElementById('mistakeChart');
  if(!sorted.length){el.innerHTML='<div style="color:var(--muted);font-size:12px;text-align:center;padding:20px">ไม่มี Mistake 🎉</div>';return;}
  el.innerHTML = sorted.map(([m,c])=>`
    <div class="bar-row">
      <div class="bar-label" style="font-size:10px;width:90px">${m}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${c/max*100}%;background:rgba(251,146,60,.6)"></div></div>
      <div class="bar-val" style="color:var(--orange)">${c}x</div>
    </div>`).join('');
}

function renderHeatmap(){
  const byDate = {};
  trades.forEach(t=>{ byDate[t.date]=(byDate[t.date]||0)+t.pnl; });
  const entries = Object.entries(byDate);
  if(!entries.length){document.getElementById('heatmapWrap').innerHTML='';return;}
  const maxAbs = Math.max(...entries.map(([,v])=>Math.abs(v)),1);
  const el = document.getElementById('heatmapWrap');
  el.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px">
    ${entries.map(([d,v])=>{
      const alpha = 0.2 + (Math.abs(v)/maxAbs)*0.7;
      const col = v>=0?`rgba(74,222,128,${alpha})`:`rgba(248,113,113,${alpha})`;
      const dFmt = new Date(d+'T00:00:00').toLocaleDateString('th-TH',{month:'short',day:'numeric'});
      return `<div class="heatmap-cell" style="background:${col}"><span style="font-size:9px;color:#fff;opacity:.7">${dFmt}</span>&nbsp;<span style="color:#fff">${v>0?'+':''}${v}</span></div>`;
    }).join('')}
  </div>`;
}

function renderTable(){
  const q = (document.getElementById('searchInput')?.value||'').toLowerCase();
  const side = document.getElementById('filterSide')?.value||'';
  let filtered = trades.filter(t=>{
    const matchQ = !q || JSON.stringify(t).toLowerCase().includes(q);
    const matchS = !side || t.side===side;
    return matchQ && matchS;
  });
  const tbody = document.getElementById('tradeBody');
  if(!filtered.length){
    tbody.innerHTML=`<tr><td colspan="17" class="empty-state" style="text-align:center;color:var(--muted);padding:40px">ไม่มีข้อมูล Trade</td></tr>`;return;
  }
  tbody.innerHTML = filtered.map(t=>`
    <tr>
      <td class="mono" style="color:var(--muted)">${t.id}</td>
      <td class="mono" style="font-size:11px">${t.date}<br><span style="color:var(--muted)">${t.start||''}</span></td>

      <td class="mono">${t.entry}</td>

      <td class="mono" style="color:var(--muted)">${t.tp}</td>
      <td><span class="${t.pnl>=0?'pnl-pos':'pnl-neg'}">${t.pnl>=0?'+':''}${t.pnl}</span></td>
      <td class="mono">$${t.balance}</td>
      <td class="mono">${t.rr}</td>
      <td style="font-size:11px;color:var(--muted)">${t.trend||''}</td>
      <td><span style="font-size:11px;background:var(--surface2);padding:2px 6px;border-radius:4px">${t.zone||''}</span></td>
      <td>${t.confirm||''}</td>

  setTimeout(()=>{

    document.getElementById('f_exit').value=t.exit;
    document.getElementById('f_sl').value=t.sl;
    document.getElementById('f_tp').value=t.tp;
    document.getElementById('f_pnl').value=t.pnl;
    document.getElementById('f_trend').value=t.trend||'';
    document.getElementById('f_zone').value=t.zone||'';
    document.getElementById('f_confirm').value=t.confirm||'✅';
    document.getElementById('f_emotion').value=t.emotion||'😊';
    document.getElementById('f_mistake').value=t.mistake||'';
    document.getElementById('f_notes').value=t.notes||'';
    currentSide=t.side;
    document.querySelectorAll('.side-btn').forEach(b=>{
      b.classList.toggle('active', b.textContent===t.side);
    });
  },50);
}

function saveTrade(){
  const date = document.getElementById('f_date').value;
  const lot = parseFloat(document.getElementById('f_lot').value)||0.01;
  const entry = parseFloat(document.getElementById('f_entry').value)||0;
  const exit = parseFloat(document.getElementById('f_exit').value)||0;
  const sl = parseFloat(document.getElementById('f_sl').value)||0;
  const tp = parseFloat(document.getElementById('f_tp').value)||0;
  let pnl = parseFloat(document.getElementById('f_pnl').value);

  if(!date||!currentSide||!entry){showToast('กรุณากรอก Date, Side, Entry Price','error');return;}

  // Auto calc pnl if empty
  if(isNaN(pnl)&&exit){
    const diff = currentSide==='BUY'?(exit-entry):(entry-exit);
    pnl = Math.round(diff*lot*100)/100;
  }
  if(isNaN(pnl))pnl=0;

  // Calc RR
  const risk = Math.abs(entry-sl);
  const reward = Math.abs(entry-tp);
  const rr = risk>0?Math.round((reward/risk)*100)/100:1;

  // Calc balance
  let balance;
  if(editingId){
    const idx = trades.findIndex(t=>t.id===editingId);
    const prevBal = idx>0?trades[idx-1].balance:(trades[idx].balance-trades[idx].pnl);
    balance = prevBal+pnl;
  } else {
    const lastBal = trades.length>0?trades[trades.length-1].balance:100;
    balance = Math.round((lastBal+pnl)*100)/100;
  }

  const trade = {
    id: editingId||nextId(),
    date, start:document.getElementById('f_start').value,
    end:document.getElementById('f_end').value,
    side:currentSide, lot, entry, exit, sl, tp, pnl, balance, rr,
    trend:document.getElementById('f_trend').value,
    zone:document.getElementById('f_zone').value,
    confirm:document.getElementById('f_confirm').value,
    emotion:document.getElementById('f_emotion').value,
    mistake:document.getElementById('f_mistake').value,
    notes:document.getElementById('f_notes').value
  };

  if(editingId){
    const idx = trades.findIndex(t=>t.id===editingId);
    trades[idx]=trade;
    // recalc subsequent balances
    for(let i=idx+1;i<trades.length;i++){
      trades[i].balance=Math.round((trades[i-1].balance+trades[i].pnl)*100)/100;
    }
  } else {
    trades.push(trade);
  }
  saveTrades();
  clearForm();
  showToast(editingId?'อัพเดต Trade สำเร็จ':'เพิ่ม Trade สำเร็จ','success');
  editingId=null;
}

// ============================================================
//  DELETE
// ============================================================
function openDelete(id){ deleteId=id; document.getElementById('deleteModal').classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function confirmDelete(){
  if(!deleteId)return;
  trades=trades.filter(t=>t.id!==deleteId);
  // recalc balances
  let bal = trades[0]?trades[0].balance-trades[0].pnl:100;
  trades.forEach(t=>{ t.balance=Math.round((bal+t.pnl)*100)/100; bal=t.balance; });
  saveTrades();
  closeModal('deleteModal');
  renderTable();
  showToast('ลบ Trade แล้ว','success');
  deleteId=null;
}

// ============================================================
//  INSIGHTS
// ============================================================
function renderInsights(){
  const s = calcStats();
  const byDay = {};
  trades.forEach(t=>{ if(!byDay[t.date])byDay[t.date]={pnl:0,count:0,wins:0}; byDay[t.date].pnl+=t.pnl; byDay[t.date].count++; if(t.pnl>0)byDay[t.date].wins++; });
  const bestDay = Object.entries(byDay).sort((a,b)=>b[1].pnl-a[1].pnl)[0];
  const worstDay = Object.entries(byDay).sort((a,b)=>a[1].pnl-b[1].pnl)[0];

  // Streak
  let maxWin=0,maxLoss=0,cur=0,curType='';
  trades.forEach(t=>{
    const type=t.pnl>0?'win':t.pnl<0?'loss':'';
    if(type===curType){cur++;}else{cur=1;curType=type;}
    if(curType==='win')maxWin=Math.max(maxWin,cur);
    if(curType==='loss')maxLoss=Math.max(maxLoss,cur);
  });

  // Zone win rates
  const zones = {};
  trades.forEach(t=>{if(!zones[t.zone])zones[t.zone]={w:0,t:0};zones[t.zone].t++;if(t.pnl>0)zones[t.zone].w++;});

  // Confirm stats
  const confTrades = trades.filter(t=>t.confirm==='✅');
  const noConfTrades = trades.filter(t=>t.confirm==='❌');
  const confWR = confTrades.length?((confTrades.filter(t=>t.pnl>0).length/confTrades.length)*100).toFixed(0):'N/A';
  const noConfWR = noConfTrades.length?((noConfTrades.filter(t=>t.pnl>0).length/noConfTrades.length)*100).toFixed(0):'N/A';

  document.getElementById('insightsGrid').innerHTML = `
    <div class="insight-card">
      <div class="insight-title">📊 Overview</div>
      ${row('Total Trades',s.total,'blue')}
      ${row('Win Rate',s.winRate+'%','green')}
      ${row('Profit Factor',s.pf,'green')}
      ${row('Avg R:R',s.avgRR,'yellow')}
      ${row('Net P&L','$'+s.netPnL,s.netPnL>=0?'green':'red')}
    </div>
    <div class="insight-card">
      <div class="insight-title">🏆 Streaks</div>
      ${row('Max Win Streak',maxWin+'x','green')}
      ${row('Max Loss Streak',maxLoss+'x','red')}
      ${row('Best Trade','$'+s.best,'green')}
      ${row('Worst Trade','$'+s.worst,'red')}
      ${row('Max Drawdown','-$'+s.maxDD,'red')}
    </div>
    <div class="insight-card">
      <div class="insight-title">📅 Daily</div>
      ${bestDay?row('Best Day','$'+bestDay[1].pnl+' ('+bestDay[0]+')','green'):''}
      ${worstDay?row('Worst Day','$'+worstDay[1].pnl+' ('+worstDay[0]+')','red'):''}
      ${row('Avg Daily Trades',(s.total/Math.max(Object.keys(byDay).length,1)).toFixed(1),'blue')}
    </div>
    <div class="insight-card">
      <div class="insight-title">✅ Confirm Stats</div>
      ${row('With Confirm Trades',confTrades.length,'blue')}
      ${row('Confirm Win Rate',confWR+'%','green')}
      ${row('No Confirm Trades',noConfTrades.length,'yellow')}
      ${row('No Confirm Win Rate',noConfWR+'%',parseFloat(noConfWR)<50?'red':'green')}
    </div>
    <div class="insight-card">
      <div class="insight-title">🗺 Zone Win Rate</div>
      ${Object.entries(zones).map(([z,v])=>row(z,(v.w/v.t*100).toFixed(0)+'% ('+v.t+')',v.w/v.t>=.5?'green':'red')).join('')}
    </div>
    <div class="insight-card">
      <div class="insight-title">📊 Side Breakdown</div>
      ${(()=>{const b=trades.filter(t=>t.side==='BUY');const sl=trades.filter(t=>t.side==='SELL');const bwr=b.length?(b.filter(t=>t.pnl>0).length/b.length*100).toFixed(0):0;const swr=sl.length?(sl.filter(t=>t.pnl>0).length/sl.length*100).toFixed(0):0;
        return row('BUY Trades',b.length,'green')+row('BUY Win Rate',bwr+'%','green')+row('SELL Trades',sl.length,'red')+row('SELL Win Rate',swr+'%','red');})()}
    </div>
  `;
}

function row(k,v,c=''){return `<div class="insight-row"><span class="insight-key">${k}</span><span class="insight-val ${c}">${v}</span></div>`;}

// ============================================================
//  EXPORT / IMPORT
// ============================================================
function exportCSV(){
  const headers = ['#','Date','Start','End','Side','Lot','Entry','Exit','SL','TP','P&L','Balance','R:R','Trend','Zone','Confirm','Emotion','Mistake','Notes'];
  const rows = trades.map(t=>[t.id,t.date,t.start,t.end,t.side,t.lot,t.entry,t.exit,t.sl,t.tp,t.pnl,t.balance,t.rr,t.trend,t.zone,t.confirm,t.emotion,t.mistake,`"${(t.notes||'').replace(/"/g,'""')}"`]);
  const csv = [headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='trading_journal.csv'; a.click();
  URL.revokeObjectURL(url);
  showToast('Export CSV สำเร็จ','success');
}

function importData(input){
  const file = input.files[0]; if(!file)return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      if(file.name.endsWith('.json')){
        const data = JSON.parse(e.target.result);
        if(Array.isArray(data)){trades=data;saveTrades();renderDashboard();showToast('Import สำเร็จ ('+data.length+' trades)','success');}
      } else if(file.name.endsWith('.csv')){
        const lines = e.target.result.split('\n').filter(l=>l.trim());
        const headers = lines[0].split(',');
        trades = lines.slice(1).map((l,i)=>{
          const v=l.split(',');
          return {id:i+1,date:v[1]||'',start:v[2]||'',end:v[3]||'',side:v[4]||'',lot:+v[5]||0.01,entry:+v[6]||0,exit:+v[7]||0,sl:+v[8]||0,tp:+v[9]||0,pnl:+v[10]||0,balance:+v[11]||0,rr:+v[12]||1,trend:v[13]||'',zone:v[14]||'',confirm:v[15]||'',emotion:v[16]||'',mistake:v[17]||'',notes:(v[18]||'').replace(/^"|"$/g,'')};
        }).filter(t=>t.date);
        saveTrades(); renderDashboard(); showToast('Import CSV สำเร็จ','success');
      }
    }catch(err){showToast('Import ผิดพลาด: '+err.message,'error');}
  };
  reader.readAsText(file,'UTF-8');
  input.value='';
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg, type='success'){
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),2800);
}

// ============================================================
//  INIT
// ============================================================
loadTrades();
renderDashboard();
